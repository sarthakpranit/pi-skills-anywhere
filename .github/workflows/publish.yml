name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    name: Publish pi-skills-anywhere
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance via OIDC

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Format and lint check
        run: bunx biome check .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test/run.ts

      - name: Set up Node.js (npm with trusted publishing)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --provenance